[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dmrv-platform-backend"
version = "1.0.0"
description = "Enterprise dMRV analytical platform - backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    # Bumped from 2.10.4/2.7.0 for google-genai below (needs pydantic>=2.12.5) -
    # see backend/Dockerfile's matching pin for why 2.13.4 is proven safe here.
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "psycopg[binary,pool]==3.2.3",
    "bcrypt==4.2.1",
    "pyjwt==2.10.1",
    "python-multipart==0.0.20",
    "numpy==2.2.1",
    "scipy==1.14.1",
    "rasterio==1.4.3",
    "pillow==11.1.0",
    "alembic==1.14.0",
    "sqlalchemy==2.0.36",
    "structlog==24.4.0",
    "slowapi==0.1.9",
    "arq==0.28.0",
    # Wave: GEE tile caching (app/services/gee_tile_cache.py). Previously only
    # a transitive dep of slowapi's Redis storage backend - now imported
    # directly, so pinned explicitly like every other direct dependency here.
    "redis==5.3.1",
    "prometheus-client==0.25.0",
    "rio-cogeo==7.0.2",
    "rio-tiler==9.4.0",
    "httpx==0.28.1",
    "pyshp==2.3.1",
    "defusedxml==0.7.1",
    "earthengine-api==1.7.38",
    # Wave: PDF report. No existing dependency writes a PDF container (checked
    # first) - fpdf2 is pure-Python with no system libs (unlike weasyprint/
    # pdfkit, which need Pango/Cairo or a wkhtmltopdf binary), matching this
    # repo's existing all-Python-wheel geo stack (rio-cogeo/rio-tiler/Pillow).
    "fpdf2==2.8.7",
    # Renders the multi-year vegetation-index trend as a static PNG for the
    # PDF - no charting library existed here before (Recharts is JS-only,
    # frontend-side). Agg backend (see report_charts.py) needs no display.
    "matplotlib==3.10.0",
    # Wave: HTML report rendering. The HTML sibling of the fpdf2 report path
    # (report_html.py) - Jinja2 with autoescaping on is pure-Python/no
    # system libs, matching this repo's existing all-Python-wheel constraint
    # (the same reason fpdf2 was chosen over weasyprint/pdfkit above: no
    # Pango/Cairo/wkhtmltopdf/browser-engine dependency to add to the runtime
    # image). markupsafe (Jinja2's own escaping dependency) is a pure
    # transitive dep of a pinned package, not pinned separately here - same
    # convention this list already applies to httpx/pytest above.
    "jinja2==3.1.6",
    # Wave: ai-report-narrative. Google's own SDK for the Gemini API
    # (`from google import genai`) - the only AI report-narrative backend
    # (decision 2026-08-12; see app/services/ai_narrative.py).
    "google-genai==2.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    # httpx is now a runtime dependency (see main dependencies list) - kept
    # importable here via that, not re-pinned twice.
    "ruff==0.8.4",
    "mypy==1.14.0",
    "pip-audit==2.7.3",
    # test-only: computing "which XYZ tile covers this point" for tile tests.
    # Not an app runtime dependency - rio-tiler pulls it in transitively, but
    # tests import it directly, so it's pinned explicitly rather than relying
    # on someone else's transitive resolution.
    "morecantile==7.0.3",
    # test-only: reading back the generated PDF's page count/text to assert
    # report content, not a runtime dependency of report generation itself.
    "pypdf==5.1.0",
]
s3 = ["boto3==1.35.90"]

# Repo root is a flat layout with several non-package top-level dirs
# (migrations/, scripts/, tests/) alongside the actual "app" package -
# without this, setuptools' auto-discovery aborts with "Multiple top-level
# packages discovered in a flat-layout: ['app', 'migrations']" on any
# `pip install -e .`/`pip install -e ".[dev]"` (confirmed by reproducing
# that exact error against this file before adding this section).
[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "integration: tests that require a live PostGIS database (run in CI)",
    "gee_live: tests that require a live, credentialed Google Earth Engine session (run manually - real quota/network cost)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "ASYNC", "S"]
ignore = ["S101"]  # asserts are fine in tests / internal invariants

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "E501", "C408"]
"migrations/**" = ["S608", "E501"]
# FastAPI's dependency-injection idiom REQUIRES call defaults like File(...)/Form(...).
"app/api/v1/datasets.py" = ["B008"]
"app/api/v1/auth.py" = ["B008"]
"app/api/v1/adhoc_layers.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = false
ignore_missing_imports = true
disallow_untyped_defs = false
